<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1020" />
    <title>Aurora Vault</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="game-panel">
        <canvas id="gameCanvas" width="420" height="760" aria-label="Aurora Vault game"></canvas>

        <div id="hud" class="hud hidden">
          <div class="top-bar">
            <div class="pill coin-pill">Coins <span id="coinValue">0</span></div>
            <div class="pill stage-pill">Stage <span id="stageValue">1</span></div>
            <div class="pill best-pill">Best <span id="bestValue">0</span></div>
          </div>

          <div class="mission-panel">
            <div class="mission-title">Objectives</div>
            <ul id="missionList"></ul>
          </div>
        </div>

        <div id="touchControls" class="touch-controls hidden">
          <button id="leftBtn" aria-label="Move left">◀</button>
          <button id="rightBtn" aria-label="Move right">▶</button>
        </div>
      </div>

      <div id="menuOverlay" class="overlay visible">
        <div class="panel">
          <p class="eyebrow">AURORA VAULT</p>
          <h1>NEON RISE</h1>
          <p class="subtitle">A vertical arcade climb through glowing vaults.</p>

          <div class="stats-row">
            <div><span id="menuCoins">0</span><small>coins</small></div>
            <div><span id="menuBest">0</span><small>best</small></div>
            <div><span id="menuDay">0</span><small>day</small></div>
          </div>

          <div class="button-stack">
            <button id="startBtn" class="primary">Start Run</button>
            <button id="continueBtn" class="secondary">Continue</button>
            <button id="dailyBtn" class="secondary">Claim Daily Reward</button>
          </div>

          <div class="tips">
            <span>Move with touch, mouse, or arrow keys.</span>
            <span>Collect crystals. Dodge pulse drones.</span>
          </div>
        </div>
      </div>

      <div id="pauseOverlay" class="overlay hidden">
        <div class="panel small">
          <h2>Paused</h2>
          <button id="resumeBtn" class="primary">Resume</button>
          <button id="quitBtn" class="secondary">Exit to Menu</button>
        </div>
      </div>

      <div id="gameoverOverlay" class="overlay hidden">
        <div class="panel small">
          <p class="eyebrow">RUN ENDED</p>
          <h2 id="gameoverTitle">Vault Lost</h2>
          <div class="summary-grid">
            <div><span id="finalScore">0</span><small>score</small></div>
            <div><span id="finalCoins">0</span><small>coins</small></div>
          </div>

          <div class="button-stack">
            <button id="restartBtn" class="primary">Restart</button>
            <button id="continueFromSaveBtn" class="secondary">Continue (50)</button>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
